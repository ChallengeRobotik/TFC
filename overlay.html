<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>OBS Overlay</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Teko:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: transparent;
      overflow: hidden;
      font-family: 'Orbitron', sans-serif;
      user-select: none;
      width: 100vw;
      height: 100vh;
    }

    .scoreboard-container {
      position: absolute;
      top: 40px;
      left: 50px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Animation d'ouverture : logo puis déploiement */
    .center-logo {
      width: 50px;
      height: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      transform: scale(0);
      animation: popLogo 0.4s ease forwards;
    }

    .center-logo img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    @keyframes popLogo {
      0% { transform: scale(0); }
      80% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .timer-wrapper {
      display: flex;
      align-items: center;
      background: #ffffff;
      border-radius: 18px;
      padding: 6px 18px;
      gap: 8px;
      transform: scaleX(0);
      transform-origin: right center;
      animation: deployBar 0.5s 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .main-bar {
      display: flex;
      align-items: center;
      background: #000000;
      border-radius: 20px;
      padding: 4px 12px;
      position: relative;
      overflow: hidden;
      transform: scaleX(0);
      transform-origin: left center;
      animation: deployBar 0.5s 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes deployBar {
      to { transform: scaleX(1); }
    }

    .timer-box {
      color: #000000;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .extra-time {
      background: #ff2a2a;
      color: #ffffff;
      font-size: 18px;
      font-weight: 900;
      padding: 2px 8px;
      border-radius: 8px;
      display: none;
    }

    .extra-time.visible {
      display: inline-block;
    }

    .team {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
      color: #ffffff;
      font-size: 20px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .team-color-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background-color: #ff0000;
    }

    .center-score-zone {
      display: flex;
      align-items: center;
      background: #00f2fe;
      border-radius: 16px;
      padding: 0 6px;
      margin: 0 6px;
      color: #000;
    }

    .score {
      font-family: 'Teko', sans-serif;
      font-size: 46px;
      font-weight: 700;
      padding: 0 14px;
      line-height: 1;
    }

    /* Animation du BUT façon banderole */
    .goal-banner {
      display: none;
      background: #ff0000;
      color: #ffffff;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 8px;
      padding: 6px 30px;
      border-radius: 16px;
      text-transform: uppercase;
    }

    .main-bar.is-goal .team,
    .main-bar.is-goal .center-score-zone {
      display: none;
    }

    .main-bar.is-goal .goal-banner {
      display: block;
    }
  </style>
</head>
<body>

  <div class="scoreboard-container" id="scoreboard">
    <div class="timer-wrapper">
      <div class="timer-box" id="timerDisplay">00:00</div>
      <div class="extra-time" id="extraTimeDisplay">+0'</div>
    </div>

    <div class="main-bar" id="mainBar">
      <div class="team">
        <div class="team-color-circle" id="circleTeam1"></div>
        <span id="nameTeam1">TEAM 1</span>
      </div>

      <div class="center-score-zone">
        <div class="score" id="scoreTeam1">0</div>
        
        <div class="center-logo">
          <img src="https://www.noelshack.com/2026-31-3-1785359559-1000007827-removebg-preview.png" alt="Logo">
        </div>

        <div class="score" id="scoreTeam2">0</div>
      </div>

      <div class="team">
        <span id="nameTeam2">TEAM 2</span>
        <div class="team-color-circle" id="circleTeam2"></div>
      </div>

      <div class="goal-banner" id="goalBanner">BUUUUUUT</div>
    </div>
  </div>

  <script>
    const channel = new BroadcastChannel('obs_scoreboard_channel');
    let goalTimeout = null;

    channel.onmessage = (event) => {
      const data = event.data;

      if (data.type === 'UPDATE') {
        document.getElementById('timerDisplay').innerText = data.timer;
        document.getElementById('nameTeam1').innerText = data.team1Name;
        document.getElementById('nameTeam2').innerText = data.team2Name;
        document.getElementById('scoreTeam1').innerText = data.score1;
        document.getElementById('scoreTeam2').innerText = data.score2;

        document.getElementById('circleTeam1').style.backgroundColor = data.color1;
        document.getElementById('circleTeam2').style.backgroundColor = data.color2;

        const extraEl = document.getElementById('extraTimeDisplay');
        if (data.extraTime && data.extraTime !== '0' && data.extraTime !== '') {
          extraEl.innerText = `+${data.extraTime}'`;
          extraEl.classList.add('visible');
        } else {
          extraEl.classList.remove('visible');
        }

        const board = document.getElementById('scoreboard');
        board.style.display = data.visible ? 'flex' : 'none';
      }

      if (data.type === 'GOAL_EVENT') {
        const bar = document.getElementById('mainBar');
        const goalBanner = document.getElementById('goalBanner');

        if (data.customText) {
          goalBanner.innerText = data.customText;
        } else {
          goalBanner.innerText = 'BUUUUUUT';
        }

        bar.classList.add('is-goal');

        if (goalTimeout) clearTimeout(goalTimeout);
        goalTimeout = setTimeout(() => {
          bar.classList.remove('is-goal');
        }, 4000);
      }
    };
  </script>
</body>
</html>
