<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>OBS Overlay</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Teko:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: transparent;
      overflow: hidden;
      font-family: 'Orbitron', sans-serif;
      user-select: none;
      width: 100vw;
      height: 100vh;
    }

    /* Conteneur principal */
    .scoreboard-container {
      position: absolute;
      top: 40px;
      left: 50px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* LOGO CENTRAL : Fond transparent et animation au chargement */
    .center-logo {
      width: 48px;
      height: 48px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      transform: scale(0);
      animation: popLogo 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .center-logo img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      background: transparent;
    }

    @keyframes popLogo {
      0% { transform: scale(0) rotate(-10deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    /* TIMER : Déploiement vers la gauche */
    .timer-wrapper {
      display: flex;
      align-items: center;
      background: #ffffff;
      border-radius: 18px;
      padding: 6px 18px;
      gap: 8px;
      transform: scaleX(0);
      transform-origin: right center;
      animation: deployLeft 0.5s 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* BARRE PRINCIPALE : Déploiement vers la droite */
    .main-bar {
      display: flex;
      align-items: center;
      background: #000000;
      border-radius: 20px;
      padding: 4px 12px;
      position: relative;
      overflow: hidden;
      transform: scaleX(0);
      transform-origin: left center;
      animation: deployRight 0.5s 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes deployLeft {
      to { transform: scaleX(1); }
    }

    @keyframes deployRight {
      to { transform: scaleX(1); }
    }

    .timer-box {
      color: #000000;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    /* TEMPS ADDITIONNEL */
    .extra-time {
      background: #ff2a2a;
      color: #ffffff;
      font-size: 18px;
      font-weight: 900;
      padding: 2px 8px;
      border-radius: 8px;
      display: none;
      animation: pulseExtra 1.2s infinite ease-in-out;
    }

    .extra-time.visible {
      display: inline-block;
    }

    @keyframes pulseExtra {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.05); }
    }

    .team {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
      color: #ffffff;
      font-size: 20px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .team-color-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background-color: #ff0000;
      transition: background-color 0.3s ease;
    }

    .center-score-zone {
      display: flex;
      align-items: center;
      background: #00f2fe;
      border-radius: 16px;
      padding: 0 6px;
      margin: 0 6px;
      color: #000;
    }

    .score {
      font-family: 'Teko', sans-serif;
      font-size: 46px;
      font-weight: 700;
      padding: 0 14px;
      line-height: 1;
      display: inline-block;
      transition: transform 0.2s ease;
    }

    .score-updated {
      animation: popScore 0.4s ease;
    }

    @keyframes popScore {
      0% { transform: scale(1); }
      50% { transform: scale(1.5); }
      100% { transform: scale(1); }
    }

    /* BANNIÈRE ROUGE DU BUT (Bandeau glissant) */
    .goal-banner {
      position: absolute;
      inset: 0;
      background: #ff0000;
      color: #ffffff;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 20px;
      text-transform: uppercase;
      transform: translateX(-100%);
      pointer-events: none;
      z-index: 20;
    }

    .main-bar.goal-in .goal-banner {
      animation: slideInGoal 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    .main-bar.goal-out .goal-banner {
      animation: slideOutGoal 0.5s cubic-bezier(0.5, 0, 0.75, 0) forwards;
    }

    @keyframes slideInGoal {
      from { transform: translateX(-100%); }
      to { transform: translateX(0%); }
    }

    @keyframes slideOutGoal {
      from { transform: translateX(0%); }
      to { transform: translateX(100%); }
    }
  </style>
</head>
<body>

  <div class="scoreboard-container" id="scoreboard">
    <div class="timer-wrapper">
      <div class="timer-box" id="timerDisplay">00:00</div>
      <div class="extra-time" id="extraTimeDisplay">+0'</div>
    </div>

    <div class="main-bar" id="mainBar">
      <div class="team">
        <div class="team-color-circle" id="circleTeam1"></div>
        <span id="nameTeam1">TEAM 1</span>
      </div>

      <div class="center-score-zone">
        <div class="score" id="scoreTeam1">0</div>
        
        <div class="center-logo">
          <img src="https://image.noelshack.com/fichiers/2026/31/3/1785359559-1000007827-removebg-preview.png" alt="Logo">
        </div>

        <div class="score" id="scoreTeam2">0</div>
      </div>

      <div class="team">
        <span id="nameTeam2">TEAM 2</span>
        <div class="team-color-circle" id="circleTeam2"></div>
      </div>

      <div class="goal-banner" id="goalBanner">BUUUUUUT</div>
    </div>
  </div>

  <script>
    const channel = new BroadcastChannel('obs_scoreboard_channel');
    let goalTimeout = null;

    function updateScoreWithAnimation(element, newValue) {
      if (element.innerText !== String(newValue)) {
        element.innerText = newValue;
        element.classList.remove('score-updated');
        void element.offsetWidth;
        element.classList.add('score-updated');
      }
    }

    channel.onmessage = (event) => {
      const data = event.data;

      if (data.type === 'UPDATE') {
        document.getElementById('timerDisplay').innerText = data.timer;
        document.getElementById('nameTeam1').innerText = data.team1Name;
        document.getElementById('nameTeam2').innerText = data.team2Name;
        
        updateScoreWithAnimation(document.getElementById('scoreTeam1'), data.score1);
        updateScoreWithAnimation(document.getElementById('scoreTeam2'), data.score2);

        document.getElementById('circleTeam1').style.backgroundColor = data.color1;
        document.getElementById('circleTeam2').style.backgroundColor = data.color2;

        const extraEl = document.getElementById('extraTimeDisplay');
        if (data.extraTime && data.extraTime !== '0' && data.extraTime !== '') {
          extraEl.innerText = `+${data.extraTime}'`;
          extraEl.classList.add('visible');
        } else {
          extraEl.classList.remove('visible');
        }

        const board = document.getElementById('scoreboard');
        board.style.display = data.visible ? 'flex' : 'none';
      }

      if (data.type === 'GOAL_EVENT') {
        const bar = document.getElementById('mainBar');

        bar.classList.remove('goal-out');
        bar.classList.add('goal-in');

        if (goalTimeout) clearTimeout(goalTimeout);

        goalTimeout = setTimeout(() => {
          bar.classList.remove('goal-in');
          bar.classList.add('goal-out');

          setTimeout(() => {
            bar.classList.remove('goal-out');
          }, 500);
        }, 3500);
      }
    };
  </script>
</body>
</html>
