<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Régie Scoreboard</title>
</head>
<body>

  <h1>Panneau de Contrôle OBS</h1>

  <div>
    <button id="toggleVisibilityBtn">Afficher / Masquer l'afficheur</button>
  </div>

  <hr>

  <h2>Équipes</h2>
  <div>
    <label>Couleur T1:</label>
    <input type="color" id="color1Input" value="#0055ff">
    <label>Nom T1:</label>
    <input type="text" id="team1Input" value="TEAM 1">
  </div>
  <br>
  <div>
    <label>Couleur T2:</label>
    <input type="color" id="color2Input" value="#ff0000">
    <label>Nom T2:</label>
    <input type="text" id="team2Input" value="TEAM 2">
  </div>

  <hr>

  <h2>Score & Animation</h2>
  <div>
    <p>Équipe 1</p>
    <button onclick="changeScore(1, -1)">-1</button>
    <button onclick="changeScore(1, 1)">+1</button>
    <button onclick="triggerGoal(1)">Lancer animation BUT (T1)</button>
  </div>
  <br>
  <div>
    <p>Équipe 2</p>
    <button onclick="changeScore(2, -1)">-1</button>
    <button onclick="changeScore(2, 1)">+1</button>
    <button onclick="triggerGoal(2)">Lancer animation BUT (T2)</button>
  </div>

  <hr>

  <h2>Chronomètre</h2>
  <h3 id="adminTimer">00:00</h3>
  <div>
    <label>Temps additionnel (min) :</label>
    <input type="number" id="extraTimeInput" value="0" min="0" max="15">
  </div>
  <br>
  <div>
    <button onclick="startTimer()">Démarrer</button>
    <button onclick="pauseTimer()">Pause</button>
    <button onclick="resetTimer()">Reset</button>
  </div>

  <script>
    const channel = new BroadcastChannel('obs_scoreboard_channel');

    let state = {
      visible: true,
      team1Name: 'TEAM 1',
      team2Name: 'TEAM 2',
      color1: '#0055ff',
      color2: '#ff0000',
      score1: 0,
      score2: 0,
      timerSeconds: 0,
      extraTime: '0'
    };

    let timerInterval = null;

    function sendUpdate() {
      const minutes = String(Math.floor(state.timerSeconds / 60)).padStart(2, '0');
      const seconds = String(state.timerSeconds % 60).padStart(2, '0');
      const timeStr = `${minutes}:${seconds}`;

      document.getElementById('adminTimer').innerText = timeStr;

      channel.postMessage({
        type: 'UPDATE',
        ...state,
        timer: timeStr
      });
    }

    function changeScore(team, delta) {
      if (team === 1) state.score1 = Math.max(0, state.score1 + delta);
      if (team === 2) state.score2 = Math.max(0, state.score2 + delta);
      sendUpdate();
    }

    function triggerGoal(team) {
      if (team === 1) state.score1++;
      if (team === 2) state.score2++;
      sendUpdate();
      channel.postMessage({ type: 'GOAL_EVENT', team: team });
    }

    document.getElementById('team1Input').addEventListener('input', (e) => {
      state.team1Name = e.target.value;
      sendUpdate();
    });

    document.getElementById('team2Input').addEventListener('input', (e) => {
      state.team2Name = e.target.value;
      sendUpdate();
    });

    document.getElementById('color1Input').addEventListener('input', (e) => {
      state.color1 = e.target.value;
      sendUpdate();
    });

    document.getElementById('color2Input').addEventListener('input', (e) => {
      state.color2 = e.target.value;
      sendUpdate();
    });

    document.getElementById('extraTimeInput').addEventListener('input', (e) => {
      state.extraTime = e.target.value;
      sendUpdate();
    });

    function startTimer() {
      if (timerInterval) return;
      timerInterval = setInterval(() => {
        state.timerSeconds++;
        sendUpdate();
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    function resetTimer() {
      pauseTimer();
      state.timerSeconds = 0;
      sendUpdate();
    }

    document.getElementById('toggleVisibilityBtn').addEventListener('click', () => {
      state.visible = !state.visible;
      sendUpdate();
    });

    sendUpdate();
  </script>
</body>
</html>
