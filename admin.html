<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Panneau de Régie - OBS Scoreboard</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #121214;
      color: #ffffff;
      padding: 30px;
      display: flex;
      justify-content: center;
    }

    .panel {
      background: #1e1e24;
      padding: 25px;
      border-radius: 12px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 20px;
      margin-bottom: 20px;
      text-align: center;
      color: #00f2fe;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .section {
      background: #2b2b36;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      align-items: center;
    }

    label {
      font-size: 13px;
      color: #aaa;
      display: block;
      margin-bottom: 5px;
    }

    input[type="text"] {
      width: 100%;
      padding: 8px 12px;
      background: #121214;
      border: 1px solid #444;
      color: #fff;
      border-radius: 6px;
      font-size: 14px;
    }

    .btn {
      background: #00f2fe;
      color: #000;
      border: none;
      padding: 10px 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover { background: #00c8d4; }
    .btn-danger { background: #ff4757; color: #fff; }
    .btn-danger:hover { background: #ff6b81; }

    .score-controls {
      display: flex;
      gap: 10px;
      margin-top: 5px;
    }

    .score-btn {
      flex: 1;
      padding: 12px;
      font-size: 18px;
      font-weight: bold;
      background: #3a3a4c;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .score-btn:hover { background: #4e4e66; }

    .timer-display {
      font-size: 32px;
      font-family: monospace;
      text-align: center;
      margin: 10px 0;
      color: #00f2fe;
    }
  </style>
</head>
<body>

  <div class="panel">
    <h1>Régie - Scoreboard Broadcast</h1>

    <!-- Visibility -->
    <div class="section">
      <button class="btn" id="toggleVisibilityBtn" style="width: 100%;">Masquer / Afficher l'afficheur</button>
    </div>

    <!-- Équipes -->
    <div class="section">
      <div class="row">
        <div style="flex: 1;">
          <label>Équipe 1</label>
          <input type="text" id="team1Input" value="TEAM 1">
        </div>
        <div style="flex: 1;">
          <label>Équipe 2</label>
          <input type="text" id="team2Input" value="TEAM 2">
        </div>
      </div>
    </div>

    <!-- Scores -->
    <div class="section">
      <div class="row">
        <div style="flex: 1; text-align: center;">
          <label>Score Équipe 1</label>
          <div class="score-controls">
            <button class="score-btn" onclick="changeScore(1, -1)">-</button>
            <button class="score-btn" onclick="changeScore(1, 1)">+</button>
          </div>
        </div>
        <div style="flex: 1; text-align: center;">
          <label>Score Équipe 2</label>
          <div class="score-controls">
            <button class="score-btn" onclick="changeScore(2, -1)">-</button>
            <button class="score-btn" onclick="changeScore(2, 1)">+</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Chronomètre -->
    <div class="section">
      <label style="text-align: center;">Chronomètre</label>
      <div class="timer-display" id="adminTimer">00:00</div>
      <div class="row">
        <button class="btn" style="flex: 1;" onclick="startTimer()">Démarrer</button>
        <button class="btn" style="flex: 1;" onclick="pauseTimer()">Pause</button>
        <button class="btn btn-danger" style="flex: 1;" onclick="resetTimer()">Reset</button>
      </div>
    </div>
  </div>

  <script>
    const channel = new BroadcastChannel('obs_scoreboard_channel');

    let state = {
      visible: true,
      team1Name: 'TEAM 1',
      team2Name: 'TEAM 2',
      score1: 0,
      score2: 0,
      timerSeconds: 0
    };

    let timerInterval = null;

    function sendState() {
      const minutes = String(Math.floor(state.timerSeconds / 60)).padStart(2, '0');
      const seconds = String(state.timerSeconds % 60).padStart(2, '0');
      const timeStr = `${minutes}:${seconds}`;

      document.getElementById('adminTimer').innerText = timeStr;

      channel.postMessage({
        type: 'UPDATE_ALL',
        ...state,
        timer: timeStr
      });
    }

    // Gestion du score
    function changeScore(team, delta) {
      if (team === 1) state.score1 = Math.max(0, state.score1 + delta);
      if (team === 2) state.score2 = Math.max(0, state.score2 + delta);
      sendState();
    }

    // Noms des équipes
    document.getElementById('team1Input').addEventListener('input', (e) => {
      state.team1Name = e.target.value;
      sendState();
    });
    document.getElementById('team2Input').addEventListener('input', (e) => {
      state.team2Name = e.target.value;
      sendState();
    });

    // Chrono Controls
    function startTimer() {
      if (timerInterval) return;
      timerInterval = setInterval(() => {
        state.timerSeconds++;
        sendState();
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    function resetTimer() {
      pauseTimer();
      state.timerSeconds = 0;
      sendState();
    }

    // Toggle Affichage
    document.getElementById('toggleVisibilityBtn').addEventListener('click', () => {
      state.visible = !state.visible;
      sendState();
    });

    // Envoi initial
    sendState();
  </script>
</body>
</html>
